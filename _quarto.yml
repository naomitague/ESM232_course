# =====================================================================
# ESM 232 / EDS 230 course website
#
# HOW TO CONTROL WHAT SHOWS UP ON THE SITE
#   1. Menus: edit the `navbar:` section below. Each `- text:` / `href:`
#      pair is one menu item. To hide an item until you teach it,
#      put a # in front of its two lines.
#   2. Home page: edit index.qmd (course description, team, schedule).
#   3. Build: in RStudio's Build tab click "Render Website", or in a
#      terminal run `quarto render`. Output goes to docs/.
#   4. Publish: commit and push, INCLUDING the docs/ folder.
#      GitHub Pages serves docs/ on the main branch.
#
# Pages are only re-run when their .qmd changes (freeze: auto), so a
# full render is quick after the first time. The _freeze/ folder that
# this creates should be committed too.
# =====================================================================

project:
  type: website
  output-dir: docs
  # Only files listed here are built. Notes, drafts, scaffolds and
  # "notused" files stay out of the site.
  render:
